<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>タイミングエディタ</title>
<style>
body{margin:0;background:#15131a;color:#eee;font-family:"Noto Sans JP",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#221e2a;flex-wrap:wrap}
header label{font-size:13px;opacity:.9} input{width:70px;background:#111;color:#fff;border:1px solid #555;border-radius:4px;padding:3px}
button{background:#ff46a0;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer} button.sub{background:#444}
#wrap{overflow-x:auto;position:relative} canvas{display:block} #help{font-size:12px;opacity:.75;padding:6px 14px} #msg{color:#7f7}
</style></head><body>
<header><b id="title">…</b>
<button id="play">▶ 再生</button>
<label>BPM <input id="bpm" type="number" step="0.1"></label>
<label>拍ずらし(秒) <input id="shift" type="number" step="0.01" value="0"></label>
<label>カット前倒し(秒) <input id="lead" type="number" step="0.01" value="0"></label>
<label>歌詞の出(秒) <input id="lin" type="number" step="0.01" value="0"></label>
<label>ズーム <input id="zoom" type="range" min="20" max="400" value="80" style="width:120px"></label>
<button id="save">💾 保存</button><span id="msg"></span></header>
<div id="help">ドラッグ: 歌詞の行（青）を左右に動かす / 右端をドラッグで終わりを変更 / セクション境界（黄色の線）を動かす。クリックでその位置から再生。保存すると mv.config.json → timing に書き込まれ、再解析しても保持されます。</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<audio id="au"></audio>
<script>
let D, pxs = 80, drag = null, edits = {}, secs = [];
const cv = document.getElementById("cv"), g = cv.getContext("2d"), au = document.getElementById("au");
const H = 360, ROW = { wave: [30, 130], sec: [140, 170], lyr: [180, 260], cut: [270, 300] };
const X = (t) => t * pxs + 10, T = (x) => (x - 10) / pxs;
fetch("/data").then((r) => r.json()).then((d) => {
  D = d; secs = d.sections.map((s) => ({ ...s }));
  document.getElementById("title").textContent = d.title;
  document.getElementById("bpm").value = d.bpm; document.getElementById("shift").value = d.timing.beatShift ?? 0;
  document.getElementById("lead").value = d.timing.cutLead ?? 0; document.getElementById("lin").value = d.timing.lyricIn ?? 0;
  if (d.audio) au.src = d.audio;
  draw();
});
function lines() { return D.lines.map((L, i) => ({ ...L, ...(edits[i] ?? {}) })); }
function draw() {
  cv.width = X(D.duration) + 20; cv.height = H;
  g.fillStyle = "#15131a"; g.fillRect(0, 0, cv.width, H);
  // waveform
  g.fillStyle = "#6a5a8a"; const mid = (ROW.wave[0] + ROW.wave[1]) / 2, amp = (ROW.wave[1] - ROW.wave[0]) / 2;
  (D.peaks || []).forEach((p, i) => { const x = X(i / D.peaksHz); g.fillRect(x, mid - p * amp, Math.max(1, pxs / D.peaksHz), p * amp * 2); });
  // beat grid
  const bpm = +document.getElementById("bpm").value || D.bpm, sh = +document.getElementById("shift").value - (D.timing.beatShift ?? 0), B = 60 / bpm;
  for (let k = 0, t = D.phase + sh; t < D.duration; k++, t = D.phase + sh + k * B) { g.fillStyle = k % 4 === 0 ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.12)"; g.fillRect(X(t), 20, 1, 290); }
  // sections
  secs.forEach((s, i) => { g.fillStyle = ["#3a2f55", "#2f4555"][i % 2]; g.fillRect(X(s.start), ROW.sec[0], X(s.end) - X(s.start), 30); g.fillStyle = "#ffd63c"; g.fillRect(X(s.start) - 1, ROW.sec[0] - 6, 3, 42); g.fillStyle = "#fff"; g.font = "12px sans-serif"; g.fillText(s.label, X(s.start) + 5, ROW.sec[0] + 19); });
  // lyrics
  lines().forEach((L, i) => { const y = ROW.lyr[0] + (i % 2) * 40; g.fillStyle = edits[i] ? "#2a9dff" : "#1f5fa0"; g.fillRect(X(L.start), y, Math.max(4, X(L.end) - X(L.start)), 34); g.fillStyle = "#fff"; g.font = "13px sans-serif"; g.fillText(L.text, X(L.start) + 4, y + 22);
    (L.words || []).forEach((w) => { g.fillStyle = "rgba(255,255,255,0.5)"; g.fillRect(X(w.t + (L.start - D.lines[i].start)), y, 1, 6); }); });
  // cuts
  const lead = +document.getElementById("lead").value - (D.timing.cutLead ?? 0);
  D.shots.forEach((s) => { g.fillStyle = "#ff46a0"; g.fillRect(X(s.start - lead), ROW.cut[0], 2, 30); });
  g.fillStyle = "#aaa"; g.font = "11px sans-serif"; g.fillText("波形 / 拍", 12, 14); g.fillText("カット", 12, ROW.cut[1] + 14);
  for (let s = 0; s < D.duration; s += 5) g.fillText(`${s}s`, X(s), H - 6);
  // playhead
  g.fillStyle = "#7f7"; g.fillRect(X(au.currentTime || 0), 0, 2, H);
}
function hit(x, y) {
  for (let i = 0; i < secs.length; i++) if (Math.abs(X(secs[i].start) - x) < 6 && y > ROW.sec[0] - 8 && y < ROW.sec[1] + 8) return { kind: "sec", i };
  const Ls = lines();
  for (let i = 0; i < Ls.length; i++) { const yy = ROW.lyr[0] + (i % 2) * 40; if (y >= yy && y <= yy + 34 && x >= X(Ls[i].start) - 2 && x <= X(Ls[i].end) + 4) return { kind: Math.abs(x - X(Ls[i].end)) < 8 ? "end" : "line", i, x0: x, s0: Ls[i].start, e0: Ls[i].end }; }
  return null;
}
cv.onmousedown = (e) => { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; drag = hit(x, y); if (!drag) { au.currentTime = Math.max(0, T(x)); draw(); } };
cv.onmousemove = (e) => { if (!drag) return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
  if (drag.kind === "sec") { const t = +T(x).toFixed(3); secs[drag.i].start = t; if (drag.i > 0) secs[drag.i - 1].end = t; }
  else { const dt = +((x - drag.x0) / pxs).toFixed(3); edits[drag.i] = drag.kind === "line" ? { start: +(drag.s0 + dt).toFixed(3), end: +(drag.e0 + dt).toFixed(3) } : { start: drag.s0, end: +(drag.e0 + dt).toFixed(3) }; }
  draw(); };
window.onmouseup = () => (drag = null);
document.getElementById("zoom").oninput = (e) => { pxs = +e.target.value; draw(); };
["bpm", "shift", "lead", "lin"].forEach((id) => (document.getElementById(id).oninput = draw));
document.getElementById("play").onclick = () => { if (au.paused) au.play(); else au.pause(); };
setInterval(() => { if (!au.paused) draw(); }, 50);
document.getElementById("save").onclick = async () => {
  const body = { bpm: +document.getElementById("bpm").value, beatShift: +document.getElementById("shift").value, cutLead: +document.getElementById("lead").value, lyricIn: +document.getElementById("lin").value, sections: secs, lines: Object.fromEntries(Object.entries(edits).map(([i, v]) => [i, v])) };
  const r = await fetch("/save", { method: "POST", body: JSON.stringify(body) }).then((x) => x.json());
  document.getElementById("msg").textContent = r.ok ? "✅ 保存しました（npm run preview で確認）" : "保存失敗";
};
</script></body></html>
