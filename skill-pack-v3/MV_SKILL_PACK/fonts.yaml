# 書体の登録簿（Font registry）
# - id: 設定や日本語コマンドで使う名前
# - family: CSS のフォント名 / file: remotion/public/fonts/ のファイル
# - category: 明朝 / ゴシック / 丸ゴシック / 手書き / 筆・和風 / ポップ / デザイン・レトロ / 欧文
# - moods: 自動選択の手がかり / jp: 日本語（かな・漢字）を含むか
# - license: 同梱してよいのは OFL / Apache / UFL など再配布できるものだけ。source に入手元
# - gf: Google Fonts のフォルダ名（npm run fonts:fetch で自動ダウンロードに使う）
# bundled: false = リポジトリには入れず、使うときに Google Fonts から自動ダウンロード（ライセンスを METADATA で再確認）。全部入れるなら npm run fonts:fetch -- --all
# licenseVerified: 登録時に google/fonts の METADATA.pb でライセンスを確認した日
# 追加は `npm run fonts:add <ファイル or Google Fonts 名>`（この表も自動で更新されます）
